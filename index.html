<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>junorion apps</title>
<style>
  :root { --bg:#FFFFFF; --text:#1C1C1E; --muted:#6C6C70; --accent:#2E9E5B; --line:#D8D8DE; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1C1C1E; --text:#F2F2F7; --muted:#A1A1A6; --accent:#62D48A; --line:#3A3A3C; } }
  body { margin:0; padding:40px 16px 64px; background:var(--bg); color:var(--text);
         font-family: system-ui, "Malgun Gothic", sans-serif; line-height:1.7; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.meta { color:var(--muted); margin:0 0 28px; }
  section { border-top:1px solid var(--line); padding:18px 0; }
  h2 { font-size:18px; margin:0 0 4px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>junorion apps</h1>
  <p class="meta">Android 앱 개발자 페이지 · Developer page</p>
  <section>
    <h2>톡톡런 · TokTok Run</h2>
    <p>메트로놈 박자에 맞춰 달리고 경로·페이스·구간을 기록하는 러닝 앱.<br>
       Run to a metronome beat and track your route, pace and splits.</p>
    <p><a href="https://junorion.github.io/running-privacy/privacy.html">개인정보처리방침 · Privacy policy</a> ·
       <a href="https://github.com/junorion/running-privacy/issues">문의 · Contact</a></p>
  </section>
</main>
</body>
</html>
